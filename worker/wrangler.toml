name = "caozhijun-visitors"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Replace database_id with the ID printed by `wrangler d1 create visitors`
[[d1_databases]]
binding       = "DB"
database_name = "visitors"
database_id   = "PASTE_DATABASE_ID_HERE"

# env.AI: transliterates city names Wikidata has no Chinese label for (fromAI in src/index.js)
[ai]
binding = "AI"

# Routes must be on a proxied (orange-cloud) hostname for requests to hit the Worker.
# www also resolves to Cloudflare and its visits count too, so route both.
[[routes]]
pattern   = "caozhijun.top/api/*"
zone_name = "caozhijun.top"

[[routes]]
pattern   = "www.caozhijun.top/api/*"
zone_name = "caozhijun.top"
